sonar.projectKey=Sciagen-ai_single-html-saver
sonar.organization=sciagen-ai
sonar.projectName=Sciagen Single HTML Saver

# Chrome MV3 extension (plain JS, no bundler for src/ beyond rollup into lib/).
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.js,test/**/*.mjs

# lib/ = rollup output of src/ and single-file-core (rebuilt by build.sh, never edited by hand).
# Third-party code vendored as-is: Mozilla Readability, css-tree (mhtml-to-html/vendor).
# test/.browser = downloaded Chrome for Testing, test/fixtures = sample saved pages.
sonar.exclusions=lib/**,**/node_modules/**,**/*.min.js,src/lib/readability/**,src/lib/mhtml-to-html/vendor/**,saved-tests/**
sonar.test.exclusions=test/.browser/**,test/fixtures/**

# No coverage report yet: the e2e test drives a real browser and node --test runs without c8.
# Static analysis (bugs, code smells, security hotspots, duplication) runs regardless.

sonar.sourceEncoding=UTF-8
